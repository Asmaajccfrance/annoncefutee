<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Formulaire de démonstration — Annonce IA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <main>
    <h1>Vendre un article</h1>
    <form>
      <label for="title">Titre</label>
      <input id="title" data-testid="title--input" name="title" type="text">

      <label for="description">Description</label>
      <textarea id="description" data-testid="description--input" name="description"></textarea>

      <label for="price">Prix</label>
      <input id="price" data-testid="price-input--input" name="price" type="text">

      <label for="status_id">État</label>
      <input id="status_id" data-testid="status-select-dropdown-input" name="status" type="text">

      <label for="color">Couleur</label>
      <input id="color" data-testid="color-select-dropdown-input" name="color" type="text">

      <label for="size_id">Taille</label>
      <input id="size_id" data-testid="size-select-dropdown-input" name="size" type="text">

      <label for="material">Matière</label>
      <input id="material" data-testid="material-select-dropdown-input" name="material" type="text">
    </form>
  </main>
</body>
</html>
